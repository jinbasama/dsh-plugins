# dsh-pwsh-guard bundle patch：把插件行挂进 profile 名册。
#
# 安装（开发态本地 link）：
#   dsh plugin --profile desktop add link:D:/lgc/Documents/deepseek-harness/default-workspace/dsh-plugins/dsh-pwsh-guard
# 安装（发布后）：
#   dsh plugin --profile <name> add dsh-pwsh-guard
#
# 用户 patch 层可覆盖下面任意字段（会热应用）。
- insert:
    - id: dsh-pwsh-guard
      name: dsh-pwsh-guard
      config:
        # deny = 命中阻断级规则时拒绝执行并返回修复建议；warn = 只记日志放行；off = 关闭闸门
        # 维护版默认 warn：规则集按 5.1 写，本机 pwsh_run 可能走 pwsh 7，先用 warn 观察误报。
        mode: warn
        # zh | en
        lang: zh
        # pwsh_run 默认自动修复 bash 风格写法
        autoFix: true
        # auto | pwsh | powershell（auto 时优先 pwsh，回退 powershell.exe）
        shell: auto
        # 深度检查（AST 语法解析 + 可选 PSScriptAnalyzer）：
        #   off = 关闭；run = 只在 pwsh_run / pwsh_check 里做（默认）；all = 连 pwsh 闸门也做
        deepCheck: run
        # builtin = 只用内置 AST；psscriptanalyzer = 额外跑 PSScriptAnalyzer（未安装则自动跳过）
        # 维护版默认 builtin：避免 pwsh_check 反复引导联网安装模块。
        analyzer: builtin
        # 内置 pwsh 输出疑似乱码时追加提示
        outputGuard: true
        # 工具接管：replace = 在每个 agent 的可见工具里隐藏内置 pwsh，只能用 pwsh_run / run_argv；off = 不接管
        # 维护版默认 off：内置 pwsh 带沙箱提权、job 注册、工作目录确保，接管前先不换掉它。
        takeover: off
        # 目标运行时：ps7（默认）| ps51
        # ps7 下不再把 && / ||、三元、?? 当坑，修复器也不拆链；只有要兼容纯 5.1 目标机时才设 ps51。
        ruleset: ps7
        # 需要临时关闭某条规则时列出，例如 ["R10", "R17"]
        disableRules: []